<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Nest</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <script>
      const canvas = document.getElementById("gl");
      const gl = canvas.getContext("webgl");

      if (!gl) {
        throw new Error("WebGL is not supported in this browser.");
      }

      const vertexSource = `
        attribute vec2 a_position;
        void main() {
          gl_Position = vec4(a_position, 0.0, 1.0);
        }
      `;

      const fragmentSource = `
        precision highp float;

        uniform vec2 u_resolution;
        uniform float u_time;
        uniform vec2 u_mouse;

        #define iterations 17
        #define formuparam 0.53

        #define volsteps 20
        #define stepsize 0.1

        #define zoom   0.800
        #define tile   0.850
        #define speed  0.010

        #define brightness 0.0015
        #define darkmatter 0.300
        #define distfading 0.730
        #define saturation 0.850

        void mainImage(out vec4 fragColor, in vec2 fragCoord) {
          vec2 uv = fragCoord.xy / u_resolution.xy - 0.5;
          uv.y *= u_resolution.y / u_resolution.x;
          vec3 dir = vec3(uv * zoom, 1.0);
          float time = u_time * speed + 0.25;

          float a1 = 0.5 + u_mouse.x / u_resolution.x * 2.0;
          float a2 = 0.8 + u_mouse.y / u_resolution.y * 2.0;
          mat2 rot1 = mat2(cos(a1), sin(a1), -sin(a1), cos(a1));
          mat2 rot2 = mat2(cos(a2), sin(a2), -sin(a2), cos(a2));
          dir.xz *= rot1;
          dir.xy *= rot2;
          vec3 from = vec3(1.0, 0.5, 0.5);
          from += vec3(time * 2.0, time, -2.0);
          from.xz *= rot1;
          from.xy *= rot2;

          float s = 0.1;
          float fade = 1.0;
          vec3 v = vec3(0.0);
          for (int r = 0; r < volsteps; r++) {
            vec3 p = from + s * dir * 0.5;
            p = abs(vec3(tile) - mod(p, vec3(tile * 2.0)));
            float pa;
            float a = pa = 0.0;
            for (int i = 0; i < iterations; i++) {
              p = abs(p) / dot(p, p) - formuparam;
              a += abs(length(p) - pa);
              pa = length(p);
            }
            float dm = max(0.0, darkmatter - a * a * 0.001);
            a *= a * a;
            if (r > 6) fade *= 1.0 - dm;
            v += fade;
            v += vec3(s, s * s, s * s * s * s) * a * brightness * fade;
            fade *= distfading;
            s += stepsize;
          }
          v = mix(vec3(length(v)), v, saturation);
          fragColor = vec4(v * 0.01, 1.0);
        }

        void main() {
          vec4 color;
          mainImage(color, gl_FragCoord.xy);
          gl_FragColor = color;
        }
      `;

      function createShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const error = gl.getShaderInfoLog(shader);
          gl.deleteShader(shader);
          throw new Error(error || "Shader compilation failed.");
        }
        return shader;
      }

      const vertexShader = createShader(gl.VERTEX_SHADER, vertexSource);
      const fragmentShader = createShader(gl.FRAGMENT_SHADER, fragmentSource);

      const program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program) || "Program linking failed.");
      }

      const positionBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
        gl.STATIC_DRAW
      );

      const positionLocation = gl.getAttribLocation(program, "a_position");
      const resolutionLocation = gl.getUniformLocation(program, "u_resolution");
      const timeLocation = gl.getUniformLocation(program, "u_time");
      const mouseLocation = gl.getUniformLocation(program, "u_mouse");

      const MS_TO_SECONDS = 0.001;
      const mouse = { x: 0, y: 0 };

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        gl.viewport(0, 0, canvas.width, canvas.height);
        if (mouse.x === 0 && mouse.y === 0) {
          mouse.x = canvas.width / 2;
          mouse.y = canvas.height / 2;
        }
      }

      window.addEventListener("resize", resize);
      window.addEventListener("mousemove", (event) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = (event.clientX - rect.left) * (canvas.width / rect.width);
        mouse.y = canvas.height - (event.clientY - rect.top) * (canvas.height / rect.height);
      });
      resize();

      function render(now) {
        gl.useProgram(program);
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);
        gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
        gl.uniform1f(timeLocation, now * MS_TO_SECONDS);
        gl.uniform2f(mouseLocation, mouse.x, mouse.y);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    </script>
  </body>
</html>
